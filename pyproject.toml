[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-search"
version = "0.1.0"
description = "Incident-Triggered Multi-Camera Vehicle Search System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Research Engineer", email = "research@example.com"}
]
dependencies = [
    "pydantic>=2.8.0",
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "torch>=2.0.0",
    "torchvision",
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "yacs>=0.1.8",
    "tabulate>=0.9.0",
    "termcolor>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pillow>=10.0.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "motmetrics>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
